[package]
name = "pontaj"
version = "0.1.0"
description = "Pontaj automat din rapoarte de tahograf"
edition = "2021"

[lib]
name = "pontaj_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pontaj-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
