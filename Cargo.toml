[workspace]
resolver = "2"
members = ["core", "src-tauri"]

# `cargo test` builds optimized: the export suite of Categoria B (core/tests/catb_excel.rs) makes, changes and checks
# dozens of months and runs about ten times slower unoptimized. `tauri dev` (the dev profile) is not affected.
[profile.test]
opt-level = 2
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
