name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed only to publish a release when a v* tag is pushed

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test -p pontaj-core

      - name: Install the Tauri CLI
        run: npm ci

      - name: Build the installer (NSIS .exe) and sign it for the updater
        run: npx tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Write latest.json (tags only; the app's updater reads it)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/make-latest-json.mjs target/release/bundle/nsis/*-setup.exe target/release/bundle/nsis/latest.json --tag "$GITHUB_REF_NAME"

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: Pontaj-Windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sig
            target/release/bundle/nsis/latest.json
            target/release/pontaj.exe
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/release/bundle/nsis/*-setup.exe target/release/bundle/nsis/*-setup.exe.sig target/release/bundle/nsis/latest.json --generate-notes --latest
